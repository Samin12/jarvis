name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-macos:
    name: macOS verification
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Format, lint, typecheck, unit test, build, and smoke test
        run: npm run verify:ci

      - name: Verify ad-hoc package layout and nested native signatures
        env:
          JARVIS_SKIP_APP_BUILD: '1'
        run: |
          npm run build:unpack:mac
          npm run verify:package:dev

      - name: Upload coverage and Electron smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            node_modules/.cache/jarvis-coverage
            node_modules/.cache/jarvis-verification-summary.json
            node_modules/.cache/jarvis-dev-package-summary.json
            node_modules/.cache/playwright-report
            node_modules/.cache/playwright-results
