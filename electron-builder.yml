appId: us.aianswer.jarvis
productName: Jarvis
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/*'
asarUnpack:
  - resources/**
  # Codex CLI ships a native binary the SDK spawns at runtime — it must live on
  # disk, not inside app.asar, or dispatch_codex_task cannot launch it.
  - node_modules/@openai/codex/**
  - node_modules/@openai/codex-darwin-arm64/**
  - node_modules/@openai/codex-darwin-x64/**
  - node_modules/@openai/codex-linux-*/**
  - node_modules/@openai/codex-win32-*/**
win:
  executableName: Jarvis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signed (identity null) so it launches on Apple Silicon without a paid
  # Developer ID. Unsigned/un-notarized → users clear Gatekeeper once (see README).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Jarvis listens to your voice so you can talk to it hands-free.
    NSCameraUsageDescription: Jarvis does not use the camera; this entry is required by the media stack.
    NSDocumentsFolderUsageDescription: Jarvis (via Codex) can act on files you ask it to work with.
    NSDownloadsFolderUsageDescription: Jarvis (via Codex) can organize your Downloads when you ask.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: Samin Yasar
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
