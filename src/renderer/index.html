<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         connect-src api.openai.com: the realtime voice lane does its SDP
         exchange from the renderer with an ephemeral ek_ secret (never the
         real key). media-src blob:/mediastream: for WebRTC remote audio. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.openai.com; media-src 'self' blob: mediastream:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
