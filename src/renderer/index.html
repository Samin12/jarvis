<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Jarvis</title>
    <!-- SDP and ChatGPT authentication stay in main/app-server. The renderer
         owns WebRTC media only and has no cross-origin HTTP capability. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: mediastream:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
